# Peak dense matmul throughput of one GPU in TFLOP/s, used as the MFU denominator.
#
# Values are NVIDIA datasheet numbers WITHOUT 2:4 structured sparsity
# (datasheets headline the sparse figure, which is 2x the dense one).
#   half: bf16/fp16 tensor-core peak
#   tf32: TF32 tensor-core peak (fp32 matmuls with matmul precision "high")
#   fp32: non-tensor-core FP32 peak (fp32 matmuls with precision "highest")
#
# Matching: a device name (torch.cuda.get_device_name(), lower-cased) uses the
# FIRST entry whose `match` substrings all appear in it. Order matters: put
# more specific entries first ("h100" is a substring of "h100 pcie", and "h20"
# of "h200").
#
# Composed into training.yaml through its defaults list, so it is available as
# `cfg.gpu_specs`; apps/launch_training.py turns each entry into a
# mew.perf.gpu_specs.GPUSpec.

gpu_specs:
  - match: [h200, nvl]
    half: 835.5
    tf32: 417.5
    fp32: 60.0
  - match: [h200]
    half: 989.4
    tf32: 494.7
    fp32: 66.9
  - match: [h100, nvl]
    half: 835.5
    tf32: 417.5
    fp32: 60.0
  - match: [h100, pcie]
    half: 756.5
    tf32: 378.0
    fp32: 51.2
  - match: [h100] # SXM
    half: 989.4
    tf32: 494.7
    fp32: 66.9
  - match: [h800, pcie]
    half: 756.5
    tf32: 378.0
    fp32: 51.2
  - match: [h800] # SXM
    half: 989.4
    tf32: 494.7
    fp32: 66.9
  - match: [h20]
    half: 148.0
    tf32: 74.0
    fp32: 44.0
  - match: [a100]
    half: 312.0
    tf32: 156.0
    fp32: 19.5
  - match: [a800]
    half: 312.0
    tf32: 156.0
    fp32: 19.5
  - match: [l40s]
    half: 362.05
    tf32: 183.0
    fp32: 91.6

defaults:
  - training
  - _self_
  - override hydra/job_logging: custom

device: cuda

data:
  batch_size: 4
  seq_len: 256

model:
  d_model: 768
  d_ff: 3072
  num_heads: 12
  num_groups: null
  vocab_size: 10000
  num_transformer_layers: 12
  rope_theta: 10000.0
  context_len: ${data.seq_len}

amp:
  enable: true
  # fp16 & bf16
  dtype: bf16 

profiling:
  warmup_steps: 10
  exec_steps: 10
  nvtx:
    # Attach per-module forward hooks so Nsight Systems renders each module
    # (e.g. SwiGLU, CausalMultiHeadSelfAttn) as a range nested under "forward".
    annotate_modules: true
    # Bracket the measured steps with cudaProfilerStart/Stop. Pair with
    # `nsys profile --capture-range=cudaProfilerApi` to record only these steps.
    use_cudart_range: true
  memory_profiling:
    enable: true
    output_path: mem_profile_dump.pkl

# Profiles one training step of the model in apps/cfgs/training.yaml, which is
# composed below: model, data shape, AMP, optimizer and the GPU peak table are
# the training ones. Override them with the training keys, for example
#   model.attn_impl=flash_triton data.batch_size=64 trainer.amp.enable=false
defaults:
  - training
  - _self_

profiling:
  output_dir: profiles/default
  warmup_steps: 10
  exec_steps: 10
  nvtx:
    # Per-module NVTX ranges. Adds CPU overhead to the timings.
    annotate_modules: true
    use_cudart_range: true
  memory_profiling:
    # Records allocation history and dumps a .pkl snapshot. Adds CPU overhead
    # to the timings.
    enable: true

hydra:
  # Relative to the working directory: run the profiler from the repository root.
  searchpath:
    - file://apps/cfgs
  run:
    dir: ${profiling.output_dir}
